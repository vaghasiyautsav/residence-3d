<title>Vaghasiya Residence 3D</title>
<style>
:root{--paper:#eef0ec;--card:#fbfbf9;--ink:#1c2226;--ink-2:#5b656d;--rule:#cfd3cc;--accent:#2f5d7c;--accent-ink:#fff;--err:#a3402c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#14181b;--card:#1d2226;--ink:#e7eae6;--ink-2:#9aa4ab;--rule:#343c42;--accent:#8bb8d6;--accent-ink:#0d1a24;--err:#e59a86;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#14181b;--card:#1d2226;--ink:#e7eae6;--ink-2:#9aa4ab;--rule:#343c42;--accent:#8bb8d6;--accent-ink:#0d1a24;--err:#e59a86;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;display:grid;place-items:center;padding-inline:16px}
.lock{width:min(340px,100%);background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:22px 22px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 30px rgba(20,30,40,.1)}
.lock b{font-size:15px;letter-spacing:.1em;text-transform:uppercase}
.lock p{margin:0;color:var(--ink-2);font-size:13.5px;line-height:1.45}
.lock label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
#pin{font:500 26px/1 ui-monospace,"IBM Plex Mono",monospace;letter-spacing:.5em;text-align:center;padding:10px 8px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);width:100%;box-sizing:border-box}
#pin:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#go{font:inherit;font-size:15px;padding:10px;border:0;border-radius:6px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
#go:disabled{opacity:.6;cursor:progress}
#msg{min-height:1.2em;font-size:13px;color:var(--err)}
</style>
<form class="lock" id="f" autocomplete="off">

</form>
